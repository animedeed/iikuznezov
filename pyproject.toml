[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iikuznezov"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
    "tzdata==2026.6",
    "httpx==0.29.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["app*", "migrations"]

[tool.setuptools.package-data]
"app.meetings" = ["avatar_web/*.html", "avatar_web/*.css", "avatar_web/*.js", "avatar_web/*.json"]
migrations = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
